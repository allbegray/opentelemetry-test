services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: "test@aimnext.co.kr"
      ZO_ROOT_USER_PASSWORD: "Test1234!"
      ZO_DATA_DIR: "/data"
    ports:
      - "5080:5080" # Web UI & OTLP HTTP (API: /api/{org}/v1/traces, /api/{org}/v1/logs, /api/{org}/v1/metrics)
      - "5081:5081" # OTLP gRPC
    volumes:
      - openobserve-data:/data

volumes:
  openobserve-data:
